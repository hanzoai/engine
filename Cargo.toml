[package]
name = "hanzo"
version = "0.1.0"
edition = "2021"
authors = ["Hanzo AI, Inc."]
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
ring = "0.17"
clap = { version = "4.4", features = ["derive"] }
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }

[[bin]]
name = "hanzo"
path = "src/main.rs"
