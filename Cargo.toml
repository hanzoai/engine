[workspace]
members = [
    "hanzo-engine",
    "hanzo-quant",
    # The full engine SDK (hanzo, hanzo-server, hanzo-cli, hanzo-bench,
    # hanzo-vision, hanzo-paged-attn, hanzo-pyo3, hanzo-audio,
    # hanzo-llm-mcp, hanzo-macros, hanzo-code-exec, hanzo-sandbox,
    # hanzo-web-chat, hanzo-server-core) was wiped by an upstream
    # merge — restore them to the workspace as they come back online.
    # See AGENTS.md for the rename history.
]
resolver = "2"

[workspace.package]
version = "0.8.3"
edition = "2021"
authors = ["Hanzo AI <dev@hanzo.ai>"]
description = "Fast, flexible LLM inference."
homepage = "https://github.com/hanzoai/engine"
repository = "https://github.com/hanzoai/engine"
keywords = ["llm", "inference", "machine-learning", "ai", "transformers"]
categories = ["science", "api-bindings", "text-processing"]
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
# Hanzo-ml fork of candle, used by hanzo-quant.
hanzo-ml = { path = "../ml/hanzo-ml" }
hanzo-nn = { path = "../ml/hanzo-nn" }
hanzo-metal-kernels = { path = "../ml/hanzo-metal-kernels" }
hanzo-flash-attn = { path = "../ml/hanzo-flash-attn" }

# Lib-internal cross-deps
hanzo-quant = { path = "hanzo-quant", version = "0.8.3" }
hanzo-engine = { path = "hanzo-engine", version = "0.6.0" }

# Workspace deps consumed transitively by hanzo-quant.
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
half = "2.7.1"
tracing = "0.1.44"
indicatif = { version = "0.18.3", features = ["rayon"] }
rayon = "1.11.0"
byteorder = "1.5.0"
yoke = { version = "0.8.1", features = ["derive"] }
memmap2 = "0.9.9"
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq", "tokio", "rustls-tls"] }
lazy_static = "1.5"
paste = "1.0.15"
tokio = { version = "1.49.0", features = ["full", "rt-multi-thread"] }
regex = "1.12.2"
safetensors = "0.7.0"
float8 = "0.7.0"
dispatch2 = { version = "0.3.0", default-features = false, features = ["block2"] }
objc2-metal = "0.3.2"
objc2-foundation = "0.3.2"
tempfile = "3.19"

# CUDA stack — optional, all gated by the `cuda` feature on hanzo-quant.
cudaforge = "0.1.2"
cuda-core = "=0.1.0"
cuda-async = "=0.1.0"
cuda-bindings = "=0.1.0"
cutile = "=0.1.0"
cutile-compiler = "=0.1.0"
cutile-ir = "=0.1.0"

[profile.release-with-debug]
inherits = "release"
debug = true

[profile.dev]
debug = true
opt-level = 3
