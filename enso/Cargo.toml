[package]
name = "enso"
version = "0.1.1"
edition = "2021"
description = "enso: the learned, eval-trained, per-user-adaptive routing policy (the brain) for hanzo-router (the mechanism)."
repository = "https://github.com/hanzoai/engine"
license = "MIT OR Apache-2.0"

[dependencies]
hanzo-router = { version = "0.1", path = "../hanzo-router" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

