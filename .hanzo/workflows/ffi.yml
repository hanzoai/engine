name: hanzo-engine-ffi (all platforms)

# Cross-platform native build of the C-ABI inference/embedding library that the
# Go EVM precompile (and any cgo caller) links. One job per platform on the
# self-hosted arcd runners (no GitHub-hosted builders). The host backend is
# auto-selected by hanzo-engine-ffi/build.sh (Metal/Accelerate on macOS,
# CUDA/ROCm/CPU on Linux).

on:
  push:
    paths:
      - 'hanzo-engine-ffi/**'
      - 'hanzo-engine/**'
      - '.hanzo/workflows/ffi.yml'
  workflow_dispatch:

jobs:
  build:
    name: ffi ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        # Only linux-amd64 is buildable today. Verified against
        # /v1/admin/actions/runners: the four ONLINE runners advertise
        # exactly ubuntu-latest, ubuntu-22.04, ubuntu-24.04 and
        # hanzo-build-linux-amd64. No runner advertises a linux-arm64 or
        # macOS pool, and the three self-hosted hosts that could (spark
        # gb10/cuda, dbc m4max/metal, evo gfx1151/rocm) are all OFFLINE.
        #
        # A job asking for a label nobody advertises does NOT fail — it queues
        # until the 24h timeout, which reads as "CI is slow" rather than
        # "CI is misconfigured". So the matrix lists what can actually run;
        # re-add the other platforms in the same change that brings their
        # runners online.
        include:
          - { label: linux-amd64, os: hanzo-build-linux-amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The job image (catthehacker/ubuntu:act-24.04) ships no Rust, so
      # build.sh died on `cargo: command not found` with exit 127 — which act
      # reports as a generic "command not found, please refer to
      # github.com/nektos/act/issues/107", pointing at act rather than at the
      # missing toolchain. Nothing else in this workflow installs one.
      #
      # Same action hanzoai/universe uses for its CLI job, so the two agree on
      # how Rust arrives on a runner.
      - uses: dtolnay/rust-toolchain@stable

      - name: Build cdylib + staticlib (host backend)
        run: |
          # Locate the cargo workspace root (handles flat or engine/-nested checkout).
          if [ -d hanzo-engine-ffi ]; then ROOT="."; \
          elif [ -d engine/hanzo-engine-ffi ]; then ROOT="engine"; \
          else echo "hanzo-engine-ffi not found" >&2; exit 1; fi
          bash "$ROOT/hanzo-engine-ffi/build.sh"

      - name: Show artifacts
        run: |
          ROOT="."; [ -d engine/hanzo-engine-ffi ] && ROOT="engine"
          ls -lh "$ROOT"/target/release/libhanzo_engine_ffi.* || true

      - name: Upload library
        uses: actions/upload-artifact@v3
        with:
          name: libhanzo_engine_ffi-${{ matrix.label }}
          path: |
            **/target/release/libhanzo_engine_ffi.dylib
            **/target/release/libhanzo_engine_ffi.so
            **/target/release/libhanzo_engine_ffi.a
          if-no-files-found: warn
