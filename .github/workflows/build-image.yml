name: Build engine

on:
  push:
    branches: [main, dev, test]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  docker:
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/engine
      # Multi-arch restored. History: the arm64 runner (spark) once corrupted
      # large GHCR layer uploads (remote error: tls: bad record MAC) because its
      # uplink was wifi — offload-computed checksums went out over a lossy link.
      # Root-cause fix is NIC offload disabled on the arm64 node
      # (ethtool -K <iface> tx off tso off gso off gro off); durable fix is
      # wiring spark to ethernet + persisting the ethtool settings.
      platforms: linux/amd64,linux/arm64
    secrets: inherit
