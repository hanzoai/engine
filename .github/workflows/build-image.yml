name: Build engine

on:
  push:
    branches: [main, dev, test]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  docker:
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/engine
      # Temporary amd64-only: the arm64 runner (spark) NIC corrupts large GHCR
      # layer uploads (remote error: tls: bad record MAC, 3/3 attempts), which
      # blocks the multi-arch manifest and therefore :latest. Single-arch routes
      # through tag-single-arch so :latest / {version} ship on amd64 while the
      # arm64 node offload fix (ethtool -K <iface> tx off tso off gso off) lands.
      # Restore "linux/amd64,linux/arm64" once spark's NIC is fixed.
      platforms: linux/amd64
    secrets: inherit
