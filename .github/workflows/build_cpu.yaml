name: build_cpu

# gh workflow run build_cpu
# The CPU image is the canonical `ghcr.io/hanzoai/engine:latest` / `:<version>`;
# CUDA and ROCm publish suffixed tags alongside it. amd64-only by policy
# (multi-arch on the self-hosted arm64 runner hung the release for 48h on lossy
# GHCR uploads). Fires on the version tag push, same event as release.yml.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
    build-and-push-image:
        runs-on: hanzo-build-linux-amd64
        timeout-minutes: 210

        permissions:
            contents: write
            packages: write
            id-token: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Initialize Docker Buildx
              uses: docker/setup-buildx-action@v3
              with:
                install: true

            - name: Login to GitHub Container Registry
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags, labels) for Docker
              id: meta-cpu
              uses: docker/metadata-action@v5
              with:
                  images: |
                    ghcr.io/${{ github.repository }}
                  flavor: |
                    latest=false
                  tags: |
                    type=semver,pattern={{version}}
                    type=ref,event=tag
                    type=raw,value=cpu
                    type=raw,value=latest

            - name: Build and push Docker image
              id: build-and-push-cpu
              uses: docker/build-push-action@v6
              with:
                context: .
                file: Dockerfile
                push: ${{ github.event_name != 'pull_request' }}
                platforms: 'linux/amd64'
                tags: ${{ steps.meta-cpu.outputs.tags }}
                labels: ${{ steps.meta-cpu.outputs.labels }}
