on:
  schedule:
      - cron: '0 0 * * 1'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

name: Continuous integration

jobs:
  check-linux:
    name: Check (linux)
    runs-on: hanzo-build-linux-amd64
    container: buildpack-deps:bookworm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check

  test-linux:
    name: Test Suite (linux)
    runs-on: hanzo-build-linux-amd64
    container: buildpack-deps:bookworm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p hanzo-engine -p hanzo-quant -p hanzo-vision
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

  fmt:
    name: Rustfmt
    runs-on: hanzo-build-linux-amd64
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: hanzo-build-linux-amd64
    # self-hosted runner image lacks a C toolchain; run in an image that has build-essential
    container: buildpack-deps:bookworm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --tests --examples -- -D warnings

  docs:
    name: Docs
    runs-on: hanzo-build-linux-amd64
    # self-hosted runner image lacks a C toolchain; run in an image that has build-essential
    container: buildpack-deps:bookworm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace

  typos:
    name: Typos
    runs-on: hanzo-build-linux-amd64
    container: buildpack-deps:bookworm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Typos check with custom config file
        uses: crate-ci/typos@master
        with:
          config: .typos.toml

  doc-links:
    name: Doc Links
    runs-on: hanzo-build-linux-amd64
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check for docs/*.md links outside docs/
        run: |
          if grep -rn '(docs/[^)]*\.md' --include='*.md' --exclude-dir=docs .; then
            echo "::error::Found docs/*.md links outside docs/ directory. Use https://hanzoai.github.io/engine/ URLs instead."
            exit 1
          fi

  msrv:
    name: MSRV Check (1.90)
    runs-on: hanzo-build-linux-amd64
    # self-hosted runner image lacks a C toolchain; run in an image that has build-essential
    container: buildpack-deps:bookworm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  # run `mlc` (`cargo install mlc`)
