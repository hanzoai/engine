name: Release Hanzo Engine

# Forge-native release pipeline for Hanzo Git (git.hanzo.ai) and act-runner (hanzoai/runner)
#
# Runs on hanzoai/runner (act-runner) connected to git.hanzo.ai:
#   * Linux legs run on [linux-amd64] and cross-compile via cargo-zigbuild.
#   * macOS leg targets the native act-runner [metal] (dbc, Apple Silicon M4 Max).
#   * Releases and assets are published via ./.hanzo/actions/forge-release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to build + release (e.g. v1.7.93). Recovers a tag whose push did not trigger a run.'
        required: false

permissions:
  contents: write   # create the release + upload assets
  id-token: write   # cosign keyless signing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create Release
    runs-on: [linux-amd64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}
      - name: Ensure the Forge Release exists
        uses: ./.hanzo/actions/forge-release
        with:
          tag: ${{ inputs.version || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## Prebuilt binaries

            One-line install (Linux/macOS):
            ```sh
            curl -fsSL https://hanzo.ai/install.sh | sh
            ```

            Then serve an OpenAI + Anthropic compatible endpoint on :1234:
            ```sh
            hanzoai --port 1234 run -m Qwen/Qwen3-4B
            ```

            Each bundle is cosign-signed when the signer is reachable -- verify with adjacent `.sig` + `.pem`.

  build:
    name: ${{ matrix.name }}
    needs: create-release
    runs-on: [linux-amd64]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hanzoai-linux-amd64
            zigtarget: x86_64-unknown-linux-gnu.2.17
            dir: x86_64-unknown-linux-gnu
            ext: tar.gz
          - name: hanzoai-linux-arm64
            zigtarget: aarch64-unknown-linux-gnu.2.17
            dir: aarch64-unknown-linux-gnu
            ext: tar.gz
    env:
      RUSTFLAGS: ""   # portable baseline codegen; overrides repo target-cpu=native
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}

      - name: System prerequisites
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends \
              build-essential cmake pkg-config curl git zip python3 python3-pip xz-utils ca-certificates
          fi

      - name: Rust toolchain + zigbuild
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- \
              -y --profile minimal --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          python3 -m pip install --user --quiet --break-system-packages 'ziglang==0.13.0' || \
            python3 -m pip install --user --quiet 'ziglang==0.13.0'
          command -v cargo-zigbuild >/dev/null 2>&1 || cargo install --locked cargo-zigbuild@0.19.8
          rustup target add ${{ matrix.dir }} || echo "rustup target ${{ matrix.dir }} unavailable on stable"

      - name: Build hanzoai (${{ matrix.name }})
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo zigbuild --release --package hanzo-server --no-default-features \
            --target ${{ matrix.zigtarget }}

      - name: Package
        run: |
          set -euo pipefail
          BINEXT="${{ matrix.binext }}"
          SRC="target/${{ matrix.dir }}/release/hanzo-server${BINEXT}"
          test -f "$SRC" || { echo "::error::build produced no binary at $SRC"; exit 1; }
          install -m 0755 "$SRC" "hanzoai${BINEXT}"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            zip -q -j "${{ matrix.name }}.zip" "hanzoai${BINEXT}"
          else
            tar -czf "${{ matrix.name }}.tar.gz" "hanzoai${BINEXT}"
          fi
          ls -la "${{ matrix.name }}.${{ matrix.ext }}"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          f="${{ matrix.name }}.${{ matrix.ext }}"
          cosign sign-blob --yes \
            --output-signature "$f.sig" \
            --output-certificate "$f.pem" \
            "$f" || echo "::warning::cosign keyless signing unavailable; shipping $f unsigned"

      - name: Upload bundle to release (forge-native)
        uses: ./.hanzo/actions/forge-release
        with:
          tag: ${{ inputs.version || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ${{ matrix.name }}.${{ matrix.ext }}
            ${{ matrix.name }}.${{ matrix.ext }}.sig
            ${{ matrix.name }}.${{ matrix.ext }}.pem

  build-macos:
    name: hanzoai-macos-${{ matrix.arch }}
    needs: create-release
    if: ${{ vars.MACOS_RUNNER_ONLINE == 'true' || true }}
    runs-on: [metal]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: amd64
            target: x86_64-apple-darwin
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}
      - name: Build + package
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          command -v cargo >/dev/null 2>&1 || { curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal; export PATH="$HOME/.cargo/bin:$PATH"; }
          rustup target add ${{ matrix.target }}
          cargo build --release --package hanzo-server --no-default-features --target ${{ matrix.target }} --features metal
          install -m 0755 "target/${{ matrix.target }}/release/hanzo-server" hanzoai
          tar -czf "hanzoai-macos-${{ matrix.arch }}.tar.gz" hanzoai
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          f="hanzoai-macos-${{ matrix.arch }}.tar.gz"
          cosign sign-blob --yes --output-signature "$f.sig" --output-certificate "$f.pem" "$f" || echo "::warning::cosign keyless signing unavailable; shipping $f unsigned"
      - name: Upload bundle to release (forge-native)
        uses: ./.hanzo/actions/forge-release
        with:
          tag: ${{ inputs.version || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            hanzoai-macos-${{ matrix.arch }}.tar.gz
            hanzoai-macos-${{ matrix.arch }}.tar.gz.sig
            hanzoai-macos-${{ matrix.arch }}.tar.gz.pem
