name: Release Hanzo Engine

# One tag -> prebuilt, portable, cosign-signed `hanzoai` binaries for every
# platform, attached to the GitHub Release. Consumed by install.sh
# (`curl -fsSL https://hanzo.ai/install.sh | sh`) and the desktop engine manager.
#
# Design notes (why this shape):
#   * EVERY build leg runs on the always-online `hanzo-build-linux-amd64` ARC
#     scale set and CROSS-compiles with cargo-zigbuild. No leg targets a
#     self-hosted mac/win runner, so nothing can sit queued for 48h and force a
#     workflow-level cancel (the historical failure: legs targeting an offline
#     runner never start, the 48h max hits, and `create-release` is skipped ->
#     zero assets on v0.9.0 / v1.0.1).
#   * `fail-fast: false` + `release: if: always()`: a flaky leg fails on its own
#     and the release still attaches whatever built.
#   * Linux amd64/arm64 only. Windows is not built: cargo-zigbuild cannot
#     cross-compile aws-lc-sys (jitterentropy needs POSIX `sched.h`, absent from
#     zig's windows-gnu sysroot), so those legs never produced a binary. Wire a
#     native Windows runner to add them back.
#   * RUSTFLAGS="" strips the repo's `.cargo/config.toml` `target-cpu=native`, so
#     the artifacts are baseline-portable (no SIGILL on other CPUs). zigbuild pins
#     a glibc floor (2.17) so the Linux binaries run on ~any distro from the last decade.
#   * The server binary is `hanzo-server` (renamed -> `hanzoai`); `hanzo-engine`
#     is a *library*. Built `--no-default-features` (CPU, no CUDA/Metal, no
#     `license-enforce`) so the public binary runs anywhere with no license token.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.7.6) — used only for the run name'
        required: false

permissions:
  contents: write   # create the release + upload assets
  id-token: write   # cosign keyless (Sigstore / GitHub OIDC) signing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: hanzo-build-linux-amd64
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hanzoai-linux-amd64
            zigtarget: x86_64-unknown-linux-gnu.2.17
            dir: x86_64-unknown-linux-gnu
            ext: tar.gz
          - name: hanzoai-linux-arm64
            zigtarget: aarch64-unknown-linux-gnu.2.17
            dir: aarch64-unknown-linux-gnu
            ext: tar.gz
    env:
      RUSTFLAGS: ""   # portable baseline codegen; overrides repo target-cpu=native
      CARGO_TERM_COLOR: always
      # Cap concurrent rustc processes so this heavy ML-stack build fits the ARC
      # pod's memory. The v1.7.6 run OOM-killed the linux runners ("lost
      # communication ... starves it for CPU/Memory") with unbounded `-j`; the
      # identical build succeeds locally. NOTE: for reliable signed CI releases the
      # `hanzo-build-linux-amd64` scale-set pods should also be given more RAM
      # (this build peaks several GB); this cap is the workflow-side mitigation.
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4

      # ARC images are minimal: install the C/build prerequisites zigbuild's C
      # deps need (aws-lc-sys -> cmake; onig_sys/esaxx-rs -> a C/C++ compiler that
      # zig provides), plus packaging tools.
      - name: System prerequisites
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends \
              build-essential cmake pkg-config curl git zip python3 python3-pip xz-utils ca-certificates
          fi

      - name: Rust toolchain + zigbuild
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- \
              -y --profile minimal --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          # zig ships as a pip wheel; cargo-zigbuild auto-detects `python3 -m ziglang`.
          python3 -m pip install --user --quiet --break-system-packages 'ziglang==0.13.0' || \
            python3 -m pip install --user --quiet 'ziglang==0.13.0'
          command -v cargo-zigbuild >/dev/null 2>&1 || cargo install --locked cargo-zigbuild@0.19.8
          rustup target add ${{ matrix.dir }} || echo "rustup target ${{ matrix.dir }} unavailable on stable"

      - name: Build hanzoai (${{ matrix.name }})
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo zigbuild --release --package hanzo-server --no-default-features \
            --target ${{ matrix.zigtarget }}

      - name: Package
        run: |
          set -euo pipefail
          BINEXT="${{ matrix.binext }}"
          SRC="target/${{ matrix.dir }}/release/hanzo-server${BINEXT}"
          test -f "$SRC" || { echo "::error::build produced no binary at $SRC"; exit 1; }
          install -m 0755 "$SRC" "hanzoai${BINEXT}"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            zip -q -j "${{ matrix.name }}.zip" "hanzoai${BINEXT}"
          else
            tar -czf "${{ matrix.name }}.tar.gz" "hanzoai${BINEXT}"
          fi
          ls -la "${{ matrix.name }}.${{ matrix.ext }}"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          f="${{ matrix.name }}.${{ matrix.ext }}"
          # Keyless signing needs egress to fulcio.sigstore.dev, which the
          # self-hosted fleet may have blocked. Never fail the release over a
          # missing signature: attach the binary regardless, signed when reachable.
          cosign sign-blob --yes \
            --output-signature "$f.sig" \
            --output-certificate "$f.pem" \
            "$f" || echo "::warning::cosign keyless signing unavailable (Fulcio egress blocked); shipping $f unsigned"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.${{ matrix.ext }}
            ${{ matrix.name }}.${{ matrix.ext }}.sig
            ${{ matrix.name }}.${{ matrix.ext }}.pem
          if-no-files-found: ignore

  # macOS is the one target that cannot be cross-compiled from Linux (needs the
  # Apple SDK + codesign). It is GATED on a repo variable so it never queues on a
  # missing runner: bring a self-hosted Apple-Silicon runner online, set repo
  # variable MACOS_RUNNER_ONLINE=true, and this leg builds natively — no other
  # change. Until then it is skipped (not queued), so it cannot hang the release.
  build-macos:
    name: hanzoai-macos-${{ matrix.arch }}
    if: ${{ vars.MACOS_RUNNER_ONLINE == 'true' }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: amd64
            target: x86_64-apple-darwin
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - name: Build + package
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          command -v cargo >/dev/null 2>&1 || { curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal; export PATH="$HOME/.cargo/bin:$PATH"; }
          rustup target add ${{ matrix.target }}
          cargo build --release --package hanzo-server --no-default-features --target ${{ matrix.target }} --features metal
          install -m 0755 "target/${{ matrix.target }}/release/hanzo-server" hanzoai
          tar -czf "hanzoai-macos-${{ matrix.arch }}.tar.gz" hanzoai
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          f="hanzoai-macos-${{ matrix.arch }}.tar.gz"
          # Non-fatal: ship the binary even when Fulcio egress is blocked (see build job).
          cosign sign-blob --yes --output-signature "$f.sig" --output-certificate "$f.pem" "$f" || echo "::warning::cosign keyless signing unavailable (Fulcio egress blocked); shipping $f unsigned"
      - uses: actions/upload-artifact@v4
        with:
          name: hanzoai-macos-${{ matrix.arch }}
          path: |
            hanzoai-macos-${{ matrix.arch }}.tar.gz
            hanzoai-macos-${{ matrix.arch }}.tar.gz.sig
            hanzoai-macos-${{ matrix.arch }}.tar.gz.pem
          if-no-files-found: ignore

  release:
    name: Create Release
    needs: [build, build-macos]
    # Attach whatever built. Runs on partial success (a failed Windows cross leg
    # must not block the linux assets); only a full run cancellation stops it.
    if: always() && !cancelled()
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Assemble + checksums
        id: assemble
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sig' -o -name '*.pem' \) \
            -exec cp {} dist/ \;
          cd dist
          shopt -s nullglob
          bundles=( *.tar.gz *.zip )
          if [ ${#bundles[@]} -eq 0 ]; then
            echo "::error::no build artifacts were produced — refusing to publish an empty release"
            exit 1
          fi
          sha256sum *.tar.gz *.zip > SHA256SUMS 2>/dev/null || true
          echo "Published platform bundles:"; ls -1 *.tar.gz *.zip
          {
            echo "## Prebuilt binaries"
            echo
            echo "One-line install (Linux/macOS):"
            echo '```sh'
            echo 'curl -fsSL https://raw.githubusercontent.com/hanzoai/engine/main/install.sh | sh'
            echo '```'
            echo
            echo "Then serve an OpenAI + Anthropic compatible endpoint on :1234:"
            echo '```sh'
            echo 'hanzoai --port 1234 run -m Qwen/Qwen3-4B'
            echo '```'
            echo
            echo "### Platform bundles"
            for b in *.tar.gz *.zip; do echo "- \`$b\`"; done
            echo
            echo "Each bundle is cosign-signed (keyless, Sigstore / GitHub OIDC): verify with the"
            echo 'adjacent `.sig` + `.pem` and `SHA256SUMS`.'
          } > ../RELEASE_NOTES.md

      - name: Create / update Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
