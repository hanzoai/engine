name: Release Hanzo Engine

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.6.0)'
        required: true

permissions:
  contents: write
  packages: write
  id-token: write   # required for cosign keyless (Sigstore / GitHub OIDC) signing

jobs:
  build-and-test:
    name: Build and Test
    runs-on: hanzoai-amd64

    steps:
    - uses: actions/checkout@v4
      with:
        path: engine
    - uses: actions/checkout@v4
      with:
        repository: hanzoai/ml
        path: ml
    - uses: actions/checkout@v4
      with:
        repository: hanzoai/node
        path: node

    - name: Install build tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq build-essential pkg-config libssl-dev

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: engine

    - name: Build (check)
      run: cargo check --manifest-path engine/Cargo.toml --package hanzo-engine --no-default-features --verbose

    - name: Run tests
      env:
        TESTS_HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: cargo test --manifest-path engine/Cargo.toml --package hanzo-engine --no-default-features

    - name: Check formatting
      run: cargo fmt --manifest-path engine/Cargo.toml --package hanzo-engine -- --check

    - name: Run clippy
      run: cargo clippy --manifest-path engine/Cargo.toml --package hanzo-engine --no-default-features -- -D warnings

  # Native build + cosign signing on the self-hosted fleet (one canonical way).
  # Every release artifact is built NATIVELY on its target platform's runner — no
  # cross-compile, no GitHub-hosted runners — and signed with cosign (keyless OIDC).
  #
  # The reusable workflow does a single `actions/checkout` of THIS repo, then runs
  # the one `build` command below on each platform. The engine has a hard Cargo
  # path-dep on ../ml (hanzo-ml / hanzo-nn / hanzo-flash-attn / hanzo-metal-kernels),
  # so the build clones hanzoai/ml (and hanzoai/node, kept for parity) as siblings,
  # installs the Rust toolchain (ARC runner images are minimal), then builds with the
  # per-platform feature flags, renames hanzo-engine -> hanzoai, and packages the same
  # tar.gz / .zip artifacts the release has always shipped. The `artifacts` glob is
  # signed by cosign and uploaded (binary + .sig + .pem) per platform.
  build-binaries:
    name: Build Native + Sign
    needs: build-and-test
    permissions:
      contents: read
      id-token: write   # cosign keyless signing needs the OIDC token on the caller
    uses: hanzoai/arc/.github/workflows/build-matrix.yml@main
    with:
      # Native fleet runners. linux-arm64 now builds NATIVELY on spark via the
      # hanzoai-arm64 ARC scale-set (was a flaky cross-compile + continue-on-error).
      platforms: >-
        [{"name":"hanzoai-linux-amd64","runsOn":"hanzoai-amd64"},
         {"name":"hanzoai-linux-arm64","runsOn":"hanzoai-arm64"},
         {"name":"hanzoai-macos-arm64","runsOn":["self-hosted","macOS","ARM64"]},
         {"name":"hanzoai-windows-amd64","runsOn":["self-hosted","Windows","X64"]}]
      # One portable build script; per-platform feature flags + packaging are derived
      # from $RUNNER_OS / $RUNNER_ARCH. Keeps the metal feature on macOS exactly as
      # before; linux/windows build CPU release binaries, matching today's artifacts.
      build: |
        set -euo pipefail

        # --- sibling deps: engine path-deps on ../ml; ../node kept for parity ---
        WS="$(cd .. && pwd)"
        for dep in ml node; do
          if [ ! -d "$WS/$dep" ]; then
            git clone --depth 1 "https://github.com/hanzoai/$dep.git" "$WS/$dep"
          fi
        done

        # --- toolchain (ARC linux images are minimal; macOS/Windows runners have it) ---
        if [ "$RUNNER_OS" = "Linux" ]; then
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq build-essential pkg-config libssl-dev curl git
          fi
        fi
        if ! command -v cargo >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          source "$HOME/.cargo/env"
        fi
        export PATH="$HOME/.cargo/bin:$PATH"

        # --- per-platform feature flags (preserve metal on Apple Silicon) ---
        FEATURES=""
        if [ "$RUNNER_OS" = "macOS" ]; then
          FEATURES="metal"
        fi

        # --- native build (no --target: builds for the host triple) ---
        if [ -n "$FEATURES" ]; then
          cargo build --package hanzo-engine --release --no-default-features --features "$FEATURES"
        else
          cargo build --package hanzo-engine --release --no-default-features
        fi

        # --- rename hanzo-engine -> hanzoai and package (same artifacts as before) ---
        case "$RUNNER_ARCH" in
          X64)   ARCH=amd64 ;;
          ARM64) ARCH=arm64 ;;
          *)     ARCH="$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')" ;;
        esac
        cd target/release
        if [ "$RUNNER_OS" = "Windows" ]; then
          mv hanzo-engine.exe hanzoai.exe
          NAME="hanzoai-windows-${ARCH}"
          7z a "$GITHUB_WORKSPACE/${NAME}.zip" hanzoai.exe
        else
          mv hanzo-engine hanzoai
          OS="$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"  # linux / macos? -> normalize
          [ "$OS" = "macos" ] || OS="linux"
          NAME="hanzoai-${OS}-${ARCH}"
          tar -czf "$GITHUB_WORKSPACE/${NAME}.tar.gz" hanzoai
        fi
      # No test step here: the build-and-test gate above already runs the full
      # check/test/fmt/clippy suite before any binary is built.
      test: ''
      artifacts: '*.tar.gz *.zip'
      sign: true   # cosign keyless (Sigstore / GitHub OIDC); see PR notes on validation
    secrets: inherit

  create-release:
    name: Create Release
    needs: build-binaries
    if: always() && !cancelled()
    runs-on: hanzoai-amd64

    steps:
    - uses: actions/checkout@v4
      with:
        path: engine

    # Downloads every per-platform artifact bundle uploaded by build-matrix.yml,
    # i.e. ./artifacts/<platform>/hanzoai-*.{tar.gz,zip} plus the cosign .sig/.pem.
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Generate changelog
      id: changelog
      run: |
        cd engine
        echo "## What's Changed" > CHANGELOG.md
        git log --pretty=format:"* %s (%h)" $(git describe --tags --abbrev=0 2>/dev/null || echo HEAD~10)..HEAD >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "## Features" >> CHANGELOG.md
        echo "- High-performance LLM inference engine" >> CHANGELOG.md
        echo "- Support for Qwen3 models (8B/4B variants)" >> CHANGELOG.md
        echo "- Native embeddings and reranking" >> CHANGELOG.md
        echo "- CUDA support for NVIDIA GPUs" >> CHANGELOG.md
        echo "- Metal support for Apple Silicon" >> CHANGELOG.md
        echo "- Flash Attention v3 support" >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "## Installation" >> CHANGELOG.md
        echo '```bash' >> CHANGELOG.md
        echo '# Download for your platform' >> CHANGELOG.md
        echo 'curl -L https://github.com/hanzoai/engine/releases/latest/download/hanzoai-$(uname -s | tr "[:upper:]" "[:lower:]")-$(uname -m).tar.gz | tar -xz' >> CHANGELOG.md
        echo 'sudo mv hanzo-engine /usr/local/bin/hanzoai' >> CHANGELOG.md
        echo '```' >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "## Verifying signatures" >> CHANGELOG.md
        echo "Artifacts are cosign-signed (keyless, Sigstore / GitHub OIDC). Each \`<artifact>\` ships a \`<artifact>.sig\` + \`<artifact>.pem\`:" >> CHANGELOG.md
        echo '```bash' >> CHANGELOG.md
        echo 'cosign verify-blob \' >> CHANGELOG.md
        echo '  --certificate hanzoai-linux-amd64.tar.gz.pem \' >> CHANGELOG.md
        echo '  --signature   hanzoai-linux-amd64.tar.gz.sig \' >> CHANGELOG.md
        echo '  --certificate-identity-regexp "https://github.com/hanzoai/.*" \' >> CHANGELOG.md
        echo '  --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \' >> CHANGELOG.md
        echo '  hanzoai-linux-amd64.tar.gz' >> CHANGELOG.md
        echo '```' >> CHANGELOG.md

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: ./artifacts/**/*
        body_path: engine/CHANGELOG.md
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docker:
    name: Publish Docker Image
    needs: build-and-test
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/engine
    secrets: inherit
