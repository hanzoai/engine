name: build-test-matrix

# Build hanzo-cli + `doctor` smoke on every self-hosted box in parallel, one
# backend per box (same label convention as gpu-tests):
#   cuda   -> spark (NVIDIA GB10, sm_121)      label: cuda
#   vulkan -> evo   (AMD Strix Halo gfx1151)   label: gfx1151
#   metal  -> dbc   (Apple M4 Max)             label: metal
#   cpu    -> hanzo-build-linux-amd64 (cloud), in a C-toolchain container
#
# hanzo-ml is a crates.io dependency (see workspace Cargo.toml), so there is no
# ../ml sibling to clone. Debug build (not --release): validates that each GPU
# backend compiles, links, and produces a runnable binary — the shippable
# release images come from build_cuda / build_rocm.

on:
  workflow_dispatch:

jobs:
  build-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cuda-spark-arm64
            runs-on: [self-hosted, cuda]
            features: cuda
            container: ""
            env_line: "CUDA_COMPUTE_CAP=121 LD_LIBRARY_PATH=/usr/local/cuda/lib64"
            path_add: "/usr/local/cuda/bin"
          - name: vulkan-evo-x64
            runs-on: [self-hosted, gfx1151]
            features: vulkan
            container: ""
            env_line: ""
            path_add: ""
          - name: metal-dbc-arm64
            runs-on: [self-hosted, metal]
            features: metal
            container: ""
            env_line: ""
            path_add: ""
          - name: cpu-linux-x64
            runs-on: hanzo-build-linux-amd64
            features: ""
            container: buildpack-deps:bookworm
            env_line: ""
            path_add: ""
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Remove cargo config (macOS ring crate fix)
        if: matrix.features == 'metal'
        run: rm -f .cargo/config.toml

      - uses: dtolnay/rust-toolchain@stable

      - name: Build hanzo-cli (${{ matrix.features || 'cpu' }})
        run: |
          export PATH="$HOME/.cargo/bin:${{ matrix.path_add }}:$PATH"
          [ -n "${{ matrix.env_line }}" ] && export ${{ matrix.env_line }}
          if [ -n "${{ matrix.features }}" ]; then
            cargo build -p hanzo-cli --features "${{ matrix.features }}" 2>&1 | tee build.log
          else
            cargo build -p hanzo-cli 2>&1 | tee build.log
          fi

      - name: Smoke test (doctor)
        run: |
          export PATH="$HOME/.cargo/bin:${{ matrix.path_add }}:$PATH"
          [ -n "${{ matrix.env_line }}" ] && export ${{ matrix.env_line }}
          target/debug/hanzo doctor 2>&1 | tee smoke.log

      # Self-hosted / ephemeral runners do not reliably retain logs in the GitHub
      # API (evo returns 0 lines; cloud blobs 404), so persist stderr as an
      # artifact for post-mortem when a cell is red.
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.name }}
          path: |
            build.log
            smoke.log
          if-no-files-found: ignore
