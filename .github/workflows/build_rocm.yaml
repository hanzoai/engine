name: build_rocm

# gh workflow run build_rocm
# Fires on the version tag push (same event as release.yml). Not on
# `release: published`: a release created by GITHUB_TOKEN does not emit a
# triggering event, so that path silently never runs.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
    build-and-push-image:
        strategy:
          matrix:
            # Each AMD target on a base that supports its ISA. gfx942 = MI300,
            # gfx90a = MI200 (ROCm 6.4); gfx1151 = Strix Halo APU (ROCm 7.x).
            include:
              - gfx_arch: gfx942
                rocm_base: rocm/dev-ubuntu-24.04:6.4.4
              - gfx_arch: gfx90a
                rocm_base: rocm/dev-ubuntu-24.04:6.4.4
              - gfx_arch: gfx1151
                rocm_base: rocm/dev-ubuntu-24.04:7.2.4
          fail-fast: false
        runs-on: hanzo-build-linux-amd64
        timeout-minutes: 210

        permissions:
            contents: write
            packages: write
            id-token: write
            security-events: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Initialize Docker Buildx
              uses: docker/setup-buildx-action@v3
              with:
                install: true

            - name: Setup cache
              uses: actions/cache@v4
              with:
                path: /tmp/.buildx-cache-rocm
                key: ${{ runner.os }}-buildx-rocm-${{ github.sha }}
                restore-keys: |
                  ${{ runner.os }}-buildx-rocm-

            - name: Inject slug/short variables
              id: slug
              uses: rlespinasse/github-slug-action@v4.5.0

            - name: Login to GitHub Container Registry
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags, labels) for Docker
              id: meta-rocm
              uses: docker/metadata-action@v5
              with:
                  images: |
                    ghcr.io/${{ github.repository }}
                  flavor: |
                    latest=false
                  tags: |
                    type=semver,pattern={{version}}-rocm-${{ matrix.gfx_arch }}
                    type=semver,pattern={{version}}-rocm,enable=${{ matrix.gfx_arch == 'gfx1151' }}
                    type=raw,value=rocm,enable=${{ matrix.gfx_arch == 'gfx1151' }}
            - name: Build and push Docker image
              id: build-and-push-rocm
              uses: docker/build-push-action@v6
              with:
                context: .
                file: Dockerfile.rocm
                push: ${{ github.event_name != 'pull_request' }}
                platforms: 'linux/amd64'
                tags: ${{ steps.meta-rocm.outputs.tags }}
                labels: ${{ steps.meta-rocm.outputs.labels }}
                build-args: |
                  ROCM_GFX_ARCH=${{ matrix.gfx_arch }}
                  ROCM_BASE=${{ matrix.rocm_base }}
                cache-from: type=local,src=/tmp/.buildx-cache-rocm
