name: build_cuda

# gh workflow run build_cuda
# Fires on the version tag push (same event as release.yml). Not on
# `release: published`: a release created by GITHUB_TOKEN does not emit a
# triggering event, so that path silently never runs.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
    build-and-push-image:
        strategy:
          matrix:
            compute_capability: [80, 86, 89, 90, 120, 121]
            # cap 121 (Blackwell GB10) is the flagship: it also gets the bare -cuda tags
          fail-fast: false
          # Build one cap at a time. The ARC pods carry no memory request, so
          # K8s packs several heavy build pods onto one node and the kernel
          # OOM-kills whichever legs co-locate ("the runner has received a
          # shutdown signal"). Per-leg memory is already bounded in
          # Dockerfile.cuda; serializing removes the cross-leg co-location that
          # is the actual killer. Durable fix is memory requests on the scale set.
          max-parallel: 1
        runs-on: hanzo-build-linux-amd64
        timeout-minutes: 210
        
        permissions:
            contents: write
            packages: write
            # This is used to complete the identity challenge
            # with sigstore/fulcio when running outside of PRs.
            id-token: write
            security-events: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Initialize Docker Buildx
              uses: docker/setup-buildx-action@v3
              with:
                install: true

            - name: Setup cache
              uses: actions/cache@v4
              with:
                path: /tmp/.buildx-cache
                key: ${{ runner.os }}-buildx-${{ github.sha }}
                restore-keys: |
                  ${{ runner.os }}-buildx-

            - name: Inject slug/short variables
              id: slug
              uses: rlespinasse/github-slug-action@v4.5.0

            - name: Login to GitHub Container Registry
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags, labels) for Docker
              id: meta-cuda
              uses: docker/metadata-action@v5
              with:
                  images: |
                    ghcr.io/${{ github.repository }}
                  flavor: |
                    latest=false
                  tags: |
                    type=semver,pattern={{version}}-cuda${{ matrix.compute_capability }}
                    type=semver,pattern={{version}}-cuda,enable=${{ matrix.compute_capability == 121 }}
                    type=raw,value=cuda,enable=${{ matrix.compute_capability == 121 }}
            - name: Build and push Docker image
              id: build-and-push-cuda
              uses: docker/build-push-action@v6
              with:
                context: .
                file: Dockerfile.cuda
                push: ${{ github.event_name != 'pull_request' }}
                platforms: 'linux/amd64'
                tags: ${{ steps.meta-cuda.outputs.tags }}
                labels: ${{ steps.meta-cuda.outputs.labels }}
                build-args: |
                  CUDA_COMPUTE_CAP=${{matrix.compute_capability}}
                cache-from: type=local,src=/tmp/.buildx-cache
