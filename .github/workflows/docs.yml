name: docs

# Build-verifies the docs site. Hosting is native (platform.hanzo.ai /
# hanzoai ingress+static builds from source) — never GitHub Pages, and it
# does not consume a CI artifact, so nothing is uploaded here.

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "hanzo-pyo3/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "hanzo-pyo3/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "docs"
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'hanzoai/engine'
    runs-on: hanzo-build-linux-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Build docs
        working-directory: docs
        run: npm run build
