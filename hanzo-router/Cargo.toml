[package]
name = "hanzo-router"
version = "0.1.0"
edition = "2021"
description = "Memory- and engine-aware model router — the native companion to hanzo-ml/hanzo-engine that hanzo-node uses to route requests across local + cloud models."
repository = "https://github.com/hanzoai/engine"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# `proxy` front (replica load-balancing HTTP server): the async/HTTP stack is
# pulled only when the feature is on, so the pure router core stays light.
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["stream", "json"] }
futures = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }

[features]
proxy = [
    "dep:axum",
    "dep:tokio",
    "dep:reqwest",
    "dep:futures",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:clap",
    "dep:anyhow",
]

[[bin]]
name = "hanzo-router"
path = "src/bin/proxy.rs"
required-features = ["proxy"]

[dev-dependencies]
