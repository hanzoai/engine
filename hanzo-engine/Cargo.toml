hanzo-metal-kernels = { workspace = true, optional = true }

[features]
# Compile-strip trace!/debug! from release binaries (true zero-cost noop in prod).
# OFF by default so trace!/debug! stay runtime-gated — near-free when RUST_LOG is
# unset, and available in *release* builds for debug-in-release (needed for big
# models too slow to run in a debug profile). Shipped prod builds add this feature:
#   cargo build --release --features strip-logs
# Then `RUST_LOG=...=trace` shows nothing because the macros are gone at compile time.
strip-logs = ["tracing/release_max_level_info"]
pyo3_macros = ["pyo3", "hanzo-llm-mcp/pyo3_macros"]
# ZAP internal RPC surface (binary wire for engine<>node). Message + adapter
# layer only; no capnp build dep. The real capnp-rpc wire is a `zap-capnp`
# sub-feature, see src/zap/transport.rs.
zap = []
cuda = [
    "hanzo-ml/cuda",
    "hanzo-nn/cuda",
    "dep:cudaforge",
    "hanzo-quant/cuda",
    "dep:hanzo-paged-attn",
    "hanzo-paged-attn/cuda",
]
cudnn = ["hanzo-ml/cudnn"]
cutile = ["cuda", "hanzo-quant/cutile"]
vulkan = [
    "hanzo-ml/vulkan",
    "hanzo-nn/vulkan",
    "hanzo-quant/vulkan",
    "dep:hanzo-paged-attn",
    "hanzo-paged-attn/vulkan",
]
wgpu = ["hanzo-ml/wgpu", "hanzo-quant/wgpu"]
rocm = [
    "hanzo-ml/rocm",
    "hanzo-nn/rocm",
    "hanzo-quant/rocm",
    "dep:hanzo-paged-attn",
    "hanzo-paged-attn/rocm",
]
metal = [
    "hanzo-ml/metal",
    "hanzo-nn/metal",
    "hanzo-quant/metal",
    "dep:hanzo-metal-kernels",
    "dep:objc",
    "dep:hanzo-paged-attn",
    "hanzo-paged-attn/metal",
    "dep:objc2-metal"
]
flash-attn = ["cuda", "dep:hanzo-flash-attn"]
flash-attn-v3 = ["cuda", "dep:hanzo-flash-attn-v3"]
# Max-opt CUDA in one feature (bare `cuda` omits these). metal/vulkan bundle their opts already.
cuda-full = ["cuda", "flash-attn", "cudnn"]
accelerate = ["hanzo-ml/accelerate", "hanzo-nn/accelerate", "hanzo-quant/accelerate"]
mkl = ["hanzo-ml/mkl", "hanzo-nn/mkl"]
nccl = ["cuda", "hanzo-quant/nccl"]
utoipa = ["dep:utoipa"]
ring = ["hanzo-quant/ring"]
code-execution = ["dep:hanzo-code-exec"]
# License gate: when on, the server-init path calls license::load_and_verify() and refuses to
# serve on any failure. OFF by default so dev/CLI/perf/test runs are not gated.
license-enforce = []
# Which app_id this engine build accepts. Exactly one should be set for a release build; if none is
# set the build defaults to the permissive dev app_id ("hanzo-dev"). These are mutually exclusive in
# intent (license.rs picks the first that is enabled).
license-app-hanzo = []
license-app-lux = []
license-app-zoo = []

[build-dependencies]
cudaforge = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
