statrs.workspace = true
openai-harmony = "0.0.8"

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "tvos"))'.dependencies]
objc = { workspace = true, optional = true }
objc2-metal = { workspace = true, optional = true }
hanzo-metal-kernels = { workspace = true, optional = true }

[features]
pyo3_macros = ["pyo3", "hanzo-llm-mcp/pyo3_macros"]
cuda = [
    "hanzo-ml/cuda",
    "hanzo-nn/cuda",
    "dep:cudaforge",
    "hanzo-quant/cuda",
    "dep:hanzo-paged-attn",
    "hanzo-paged-attn/cuda",
]
cudnn = ["hanzo-ml/cudnn"]
cutile = ["cuda", "hanzo-quant/cutile"]
vulkan = ["hanzo-ml/vulkan", "hanzo-nn/vulkan", "hanzo-quant/vulkan"]
rocm = ["hanzo-ml/rocm", "hanzo-nn/rocm", "hanzo-quant/rocm"]
metal = [
    "hanzo-ml/metal",
    "hanzo-nn/metal",
    "hanzo-quant/metal",
    "dep:hanzo-metal-kernels",
    "dep:objc",
    "dep:hanzo-paged-attn",
    "hanzo-paged-attn/metal",
    "dep:objc2-metal"
]
flash-attn = ["cuda", "dep:hanzo-flash-attn"]
flash-attn-v3 = ["cuda", "dep:hanzo-flash-attn-v3"]
# Max-opt CUDA in one feature (bare `cuda` omits these). metal/vulkan bundle their opts already.
cuda-full = ["cuda", "flash-attn", "cudnn"]
accelerate = ["hanzo-ml/accelerate", "hanzo-nn/accelerate", "hanzo-quant/accelerate"]
mkl = ["hanzo-ml/mkl", "hanzo-nn/mkl"]
nccl = ["cuda", "hanzo-quant/nccl"]
utoipa = ["dep:utoipa"]
ring = ["hanzo-quant/ring"]
code-execution = ["dep:hanzo-code-exec"]

[build-dependencies]
cudaforge = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
