[package]
name = "hanzo-engine"
version = "0.6.0"
edition = "2021"
description = "Hanzo Engine - canonical inference + embedding engine for the Hanzo stack"
homepage = "https://github.com/hanzoai/engine"
repository = "https://github.com/hanzoai/engine"
license = "MIT"

[lib]
name = "hanzo_engine"
path = "src/lib.rs"

[dependencies]
# Lib internals
anyhow = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "sync"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# Stub backend until canonical hanzo-engine src tree is restored.
# Real inference + embedding lived in `mistralrs-core` and `hanzo`
# (the SDK facade). Both are currently mid-rename and don't compile,
# so this crate ships as a stub: the registry + traits compile but
# `MistralEngine::from_hf_repo` and friends return "engine not built
# with backend" at runtime. Re-enable with `--features real-engine`
# once the engine source tree is back in shape.
default = []
real-engine = []
cuda = []
metal = []
flash-attn = []
mkl = []
no-cuda = []
# Tests that load an actual model; gated because models are large.
real-model = []
