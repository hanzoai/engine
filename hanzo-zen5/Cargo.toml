[package]
name = "hanzo-zen5"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Zen5 inference engine bindings. FFI wrapper around zen5-engine C runtime (default) with a candle-rs native backend behind a feature flag."
license = "Apache-2.0"
links = "ds4"
build = "build.rs"

[features]
# `ffi` links the vendored zen5-engine C runtime (Metal on macOS, CUDA on Linux,
# CPU elsewhere). Ships today, exact parity with upstream.
default = ["ffi"]
ffi = ["dep:libc"]
# `native` enables the candle-rs DeepSeek V4 Flash scaffold. Compiles standalone
# (no C toolchain needed) — useful for headless CI and for the long-term port.
native = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers"]
# Backend selection for the C build. When none are enabled, build.rs falls back
# to CPU. macOS users want `metal`; Linux Spark/H100 want `cuda`.
metal = []
cuda = []

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt"] }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }

# FFI backend
libc = { workspace = true, optional = true }

# Native backend (kept off the default path). Uses the engine workspace's
# candle-core / candle-nn path overrides — the hanzo-ml fork at ../ml — so
# there is exactly one half/candle version in the dependency tree.
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
# candle-transformers is not re-exported by the engine workspace; pull
# directly from the local hanzo-transformers fork so we stay on the same
# candle-core. Optional so the default `ffi` build path doesn't pull it.
candle-transformers = { path = "../../ml/hanzo-transformers", package = "hanzo-transformers", version = "0.9.2-alpha.2", optional = true, default-features = false }

[build-dependencies]
cc = "1.0"
bindgen = "0.70"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }

[[example]]
name = "inference"
path = "examples/inference.rs"
