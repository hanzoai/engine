[files]
extend-exclude = [
    ".git/",
    "calibration_data/",
    "examples/server/phi3_duckduckgo_hanzo.ipynb",
    "hanzo-cli/static/",
    "CLAUDE.md",
    "hanzo-web-chat/static/",
    "examples/server/phi3_duckduckgo_mistral.rs.ipynb",
]
ignore-hidden = false

[default]
extend-ignore-re = [
    "cudaDevAttrMaxSharedMemoryPerBlockOptin",
    '"tese"',
    "setp\\.ne\\.b32",
    # metal_kernels
    "out uneeded values",
    "copy_gg_dynamic_nd1",
    "copy_gg_dynamic_nd2",
    "copy_gg_dynamic_nd3",
    "copy_g_nd1",
    "copy_g_nd2",
    "copy_g_nd3",
    "copy_gg_nd1",
    "copy_gg_nd2",
    "copy_gg_nd3",
    "elem_to_loc_2_nd",
    "elem_to_loc_3_nd",
    "thr_reduce",
    "(?i)thw",
    "iy",
    "mxfp4_get_max_smem_optin",
    "alog",
    "ba",
    # mmq_gguf CUDA kernels (ggml port)
    "ggml_cuda_get_max_cpy_bytes",
    "nb_per_cpy",
    "ggml_cuda_ue4m3_to_fp32",
    "ue4m3",
    "UE4M3",
    "ue8m0",
    "UE8M0",
    "CU_DEVICE_ATTRIBUTE_MAX_SHARED_MEMORY_PER_BLOCK_OPTIN",
    "PNGs",
]

[default.extend-words]
"ammount" = "ammount"
# ROCm Heterogeneous System Architecture (HSA_XNACK env var)
"HSA" = "HSA"
# least-squares accumulator sum(w * x * Laux) in convert_fp8_to_gguf.py
"sxl" = "sxl"
# TRELLIS flexicubes interpolated-edge variable
"ue" = "ue"
# 3D-generation route/module naming (/v1/3d)
"threed" = "threed"
"arange" = "arange"
"layrnorm" = "layrnorm"
"ot" = "ot"
"thr" = "thr"
"mis" = "mis"
"Hel" = "Hel"
"nothink" = "nothink"

