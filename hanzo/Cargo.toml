[package.metadata.docs.rs]
all-features = true

[features]
# NVIDIA CUDA GPU support
cuda = ["hanzo-engine/cuda"]
# Vulkan GPU support (AMD APU via hanzo-ml vulkan backend)
vulkan = ["hanzo-engine/vulkan"]
rocm = ["hanzo-engine/rocm"]
# cuDNN acceleration (requires cuda)
cudnn = ["hanzo-engine/cudnn"]
# Apple Metal GPU support (macOS/iOS)
metal = ["hanzo-engine/metal"]
# Flash Attention 2 kernels (requires cuda)
flash-attn = ["cuda", "hanzo-engine/flash-attn"]
# Apple Accelerate framework for BLAS operations
accelerate = ["hanzo-engine/accelerate"]
# Intel MKL acceleration for BLAS operations
mkl = ["hanzo-engine/mkl"]
# Multi-GPU support via NCCL (requires cuda)
nccl = ["hanzo-engine/nccl"]
# Use ring instead of aws-lc-rs for TLS
ring = ["hanzo-engine/ring"]
# Python code execution tool
code-execution = ["hanzo-engine/code-execution"]
